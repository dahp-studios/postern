<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Postern</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Postern · receive from phone</h1>

  <section id="waiting" hidden>
    <p>Scan with your phone's camera:</p>
    <img id="qr" alt="QR code to scan with your phone">
    <p class="muted"><span id="status">Waiting for phone…</span> <span id="timer"></span></p>
    <p id="no-field" class="muted small" hidden>No text field is selected. Links and files still work. To fill a password or text, click into the field first, then open Postern.</p>
  </section>

  <section id="received" hidden>
    <p id="received-title" class="title"></p>
    <div id="preview" class="preview" hidden></div>
    <p class="muted small">Does your phone show this code? Only continue if it matches.</p>
    <p id="code" class="code"></p>
    <div id="actions" class="actions"></div>
  </section>

  <section id="message" hidden>
    <p id="message-text"></p>
    <button id="retry" hidden>Try again</button>
  </section>

  <footer><a href="options.html" target="_blank" class="muted small">Settings</a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
