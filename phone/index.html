<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <title>Send Password</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>🔒 Send password to laptop</h1>

    <section id="send" hidden>
      <p class="hint">It's encrypted on this phone. Only the laptop that showed the QR code can read it.</p>
      <form id="form" autocomplete="on">
        <!-- Hidden username field helps phone password managers offer autofill. -->
        <input type="text" name="username" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true">
        <label for="password">Password</label>
        <div class="field">
          <input id="password" name="password" type="password" autocomplete="current-password"
                 autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="1024" required>
          <button type="button" id="toggle" aria-label="Show password">Show</button>
        </div>
        <p class="hint small">Type, paste, or use the 🔑 on your keyboard to pick a saved password.</p>
        <button type="submit" id="submit">Send</button>
      </form>
    </section>

    <section id="done" hidden>
      <p>Sent. Check that your laptop shows this code:</p>
      <p id="code" class="code" aria-live="polite"></p>
      <p class="hint">If the codes don't match, don't fill it on the laptop.</p>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
